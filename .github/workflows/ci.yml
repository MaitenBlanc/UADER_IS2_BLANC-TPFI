name: CI/CD Pipeline IS2

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalar librerías del TP
        pip install ruff black mypy pyright pytest pytest-cov bandit pdoc boto3
        # Instalar el proyecto en modo editable para que Pytest lo encuentre
        pip install -e .

    - name: Run Linters and Formatters (Black & Ruff)
      run: |
        black --check src/ tests/
        ruff check src/ tests/

    - name: Run Security Check (Bandit)
      run: |
        bandit -r src/ -ll

    - name: Run Type Checking (MyPy)
      # Solo se analiza src/ para evitar falsos positivos con los Mocks de tests/
      run: |
        mypy src/

    - name: Run Tests with Pytest
      run: |
        pytest --cov=src/tpfi_is2_aws tests/ --cov-fail-under=85

    - name: Generate Documentation (pdoc)
      if: success()
      run: |
        mkdir -p docs_output
        pdoc src/tpfi_is2_aws -o docs_output