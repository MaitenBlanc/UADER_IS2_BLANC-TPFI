[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TPFI-IS2-AWS"
version = "1.0.0"
description = "Trabajo Práctico Final Integrador IS2 con Patrones y DynamoDB."
readme = "README.md"
authors = [
  {name = "Maiten Blanc", email = "maitengblanc@gmail.com"}
]
maintainers = [
  {name = "Maiten Blanc", email = "maitengblanc@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "boto3",
]
requires-python = ">= 3.12"

[project.urls]
bugs = "https://github.com/MaitenBlanc/UADER_IS2_BLANC-TPFI/issues"
changelog = "https://github.com/MaitenBlanc/UADER_IS2_BLANC-TPFI/blob/main/CHANGELOG.md"
homepage = "https://github.com/MaitenBlanc/UADER_IS2_BLANC-TPFI"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
source = ["src/tpfi_is2_aws"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tpfi_is2_aws"]