[project]
site_name = "TPFI IS2 AWS"
site_url = "https://MaitenBlanc.github.io/TPFI-IS2-AWS/"
repo_url = "https://github.com/MaitenBlanc/TPFI-IS2-AWS"
repo_name = "MaitenBlanc/TPFI-IS2-AWS"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
